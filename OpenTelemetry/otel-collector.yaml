receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp_grpc/aspire:
    endpoint: otel-dashboard:18889
    tls:
      insecure: true
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:9464
    namespace: copilot

service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [otlp_grpc/aspire, otlp_http/loki]
    metrics:
      receivers: [otlp]
      exporters: [otlp_grpc/aspire, prometheus]
    traces:
      receivers: [otlp]
      exporters: [otlp_grpc/aspire, otlp_grpc/tempo]
