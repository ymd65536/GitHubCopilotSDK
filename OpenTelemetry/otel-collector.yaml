receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp/aspire:
    endpoint: otel-dashboard:18889
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:9464
    namespace: copilot

service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [otlp/aspire]
    metrics:
      receivers: [otlp]
      exporters: [otlp/aspire, prometheus]
    traces:
      receivers: [otlp]
      exporters: [otlp/aspire]
