apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: a2a-copilot
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'calculator-agent'
        metrics_path: /metrics
        static_configs:
          - targets: ['calculator-agent-svc:8002']
      - job_name: 'weather-agent'
        metrics_path: /metrics
        static_configs:
          - targets: ['weather-agent-svc:8001']
      - job_name: 'dispatcher'
        metrics_path: /metrics
        static_configs:
          - targets: ['dispatcher-svc:8000']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: a2a-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus/
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: a2a-copilot
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
  type: NodePort # ブラウザで見れるように
