---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: a2a-copilot
  labels:
    app: dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcher
  template:
    metadata:
      labels:
        app: dispatcher
    spec:
      containers:
      - name: dispatcher
        image: a2a-dispatcher:latest
        imagePullPolicy: Never  # Rancher Desktopでローカルイメージを使用
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PORT
          value: "8000"
        - name: COPILOT_MODEL
          value: "gpt-5-mini"
        - name: AGENT_ENDPOINTS
          value: "http://weather-agent-svc:8001,http://calculator-agent-svc:8002"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcher-svc
  namespace: a2a-copilot
spec:
  type: LoadBalancer
  selector:
    app: dispatcher
  ports:
  - name: http
    port: 8000
    targetPort: 8000
