---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-agent
  namespace: a2a-copilot
  labels:
    app: a2a-agent
    agent: calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a2a-agent
      agent: calculator
  template:
    metadata:
      labels:
        app: a2a-agent
        agent: calculator
    spec:
      containers:
      - name: calculator-agent
        image: a2a-agent:latest
        imagePullPolicy: Never  # Rancher Desktopでローカルイメージを使用
        command: ["python3", "calculator_agent.py"]
        ports:
        - containerPort: 8002
          name: http
        env:
        - name: PORT
          value: "8002"
        - name: COPILOT_MODEL
          value: "gpt-5-mini"
        - name: COPILOT_GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: token
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8002
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: calculator-agent-svc
  namespace: a2a-copilot
spec:
  type: ClusterIP
  selector:
    app: a2a-agent
    agent: calculator
  ports:
  - name: http
    port: 8002
    targetPort: 8002
